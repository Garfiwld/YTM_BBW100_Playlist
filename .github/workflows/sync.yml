name: sync-hot-100

on:
  schedule:
    - cron: "0 13 * * 3"   # Wed 13:00 UTC = 20:00 Asia/Bangkok
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-hot-100
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Write browser auth
        run: printf '%s' "$YTM_BROWSER_JSON" > browser.json
        env:
          YTM_BROWSER_JSON: ${{ secrets.YTM_BROWSER_JSON }}

      - name: Run sync
        run: python sync.py

      - name: Commit state
        run: |
          rm -f browser.json
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json cache.json unmatched.txt
          git diff --cached --quiet || git commit -m "sync $(date -u +%F)"
          git push
